# Dearlly: the same stack locally and on the server.
#   cp .env.example .env && docker compose up --build
# Web: http://localhost:3100  API: http://localhost:8100/health
# (3100/8100 so Dearlly can run next to other projects that use 3000/8000.)

name: dearlly

x-hardened: &hardened
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped
  tmpfs: ["/tmp"]

x-backend: &backend
  <<: *hardened
  build: ./backend
  image: dearlly-api:local
  env_file: .env
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    <<: *hardened
    image: postgres:16-trixie
    user: "999:999"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs: ["/tmp", "/var/run/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    <<: *hardened
    image: redis:8-trixie
    user: "999:999"
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs database migrations once, then exits. The API starts only if this succeeds.
  migrate:
    <<: *hardened
    image: dearlly-api:local
    build: ./backend
    env_file: .env
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8000"

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 15s
      start_period: 30s
      retries: 3

  beat:
    <<: *backend
    command: ["celery", "-A", "app.worker:celery_app", "beat", "--loglevel=INFO"]
    healthcheck:
      # Beat writes its schedule file once it is running.
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists('/tmp/celerybeat-schedule') else 1)"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3

  web:
    <<: *hardened
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: dearlly-web:local
    tmpfs: ["/tmp", "/app/.next/cache"]
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
