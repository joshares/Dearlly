name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests, migrations, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-trixie
        env:
          POSTGRES_USER: dearlly
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: dearlly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dearlly -d dearlly_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-trixie
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://dearlly:ci-only-not-a-secret@localhost:5432/dearlly_test
      TEST_DATABASE_URL: postgresql+asyncpg://dearlly:ci-only-not-a-secret@localhost:5432/dearlly_test
      REQUIRE_DB_TESTS: "1"
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Migrations apply, roll back and re-apply cleanly
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Pytest
        run: pytest
      - name: pip-audit (runtime)
        run: pip-audit --require-hashes --disable-pip -r requirements.txt
      - name: pip-audit (dev tools)
        run: pip-audit --require-hashes --disable-pip -r requirements-dev.txt

  frontend:
    name: Frontend (lint, types, tests, build, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from lockfile (no install scripts)
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: npm audit (runtime)
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Images (build + Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose file is valid
        run: cp .env.example .env && docker compose config --quiet
      - name: Build API image
        run: docker build -t dearlly-api:ci backend
      - name: Build web image
        run: docker build -t dearlly-web:ci --build-arg NEXT_PUBLIC_API_URL=https://api.example.invalid --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA frontend
      - name: Trivy scan (API image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: dearlly-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy scan (web image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: dearlly-web:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Trivy config scan (Dockerfiles)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-setup-trivy: true
