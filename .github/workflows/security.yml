name: Security scans

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (secrets, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan every commit for secrets
        # gitleaks v8.30.1, pinned by digest.
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/repo:ro
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --exit-code 1

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan code
        # semgrep 1.182.0, pinned by digest.
        run: >-
          docker run --rm -e SEMGREP_SEND_METRICS=off -v "$PWD":/src:ro -w /src
          semgrep/semgrep@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
          semgrep scan --error
          --config p/python --config p/typescript --config p/react --config p/nextjs
          --config p/secrets --config p/dockerfile --config p/github-actions
