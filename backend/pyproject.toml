[project]
name = "dearlly-api"
version = "0.1.0"
description = "Dearlly API and background worker"
requires-python = ">=3.12,<3.13"
# Dependencies live in requirements.in / requirements-dev.in (locked with hashes in the .txt files).

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "BLE", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

# Celery ships without type hints, so its task decorators are untyped.
[[tool.mypy.overrides]]
module = ["app.worker"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
