# Experience types. A new type = a new entry here + its form and animation (no rebuild).
#
# key:        stable id stored with each experience (never rename once live)
# name:       shown in the app
# email_subject: subject of the email to the recipient ({sender} is filled in)
# fields:     the type's own content
#   kind:       text (default), datetime (in the future, within a year), date (a day, today or
#               later, within a year), city (from cities.yaml)
#               or place (a place key from cities.yaml in the chosen city; the server copies its
#               name, area and address into place_name / place_area / place_address)
#   max:        maximum characters (text)
#   required:   must be filled in
# themes:     paper styles the sender can pick
# reply:      how the recipient answers: "reaction" (pick one + optional note) or "yes_no" (Stage 5)
# reactions:  for reply: reaction, the choices the recipient sees

experience_types:
  - key: love_note
    name: Love note
    email_subject: "{sender} sealed a letter for you 💌"
    fields:
      quote_title:
        max: 80
        required: false
      quote_text:
        max: 600
        required: true
    themes: [cream, kraft, rose]
    reply: reaction
    reactions:
      - key: love_it
        label: I love this
      - key: aww
        label: Aww
      - key: smiling
        label: You made me smile
      - key: forever
        label: Forever yours

  - key: date_invite
    name: Date invitation
    email_subject: "{sender} is asking you on a date 💌"
    fields:
      message:
        max: 400
        required: true
      city:
        kind: city
        required: true
      place_key:
        kind: place
        required: false
      place_name:
        max: 80
        required: false
      place_area:
        max: 60
        required: false
      place_address:
        max: 120
        required: false
      date_at:
        kind: datetime
        required: true
      note:
        max: 200
        required: false
    themes: [cream, kraft, rose]
    reply: yes_no
    reactions:
      # Quoted: YAML would read a bare yes/no as true/false.
      - key: "yes"
        label: "Yes!"
      - key: "no"
        label: Not this time

  - key: vacation_invite
    name: Vacation invitation
    email_subject: "{sender} is planning a trip for you two 💌"
    fields:
      message:
        max: 400
        required: true
      destination:
        max: 80
        required: true
      start_date:
        kind: date
        required: true
      end_date:
        kind: date
        required: true
      packing:
        max: 300
        required: false
      note:
        max: 200
        required: false
    themes: [cream, kraft, rose]
    reply: yes_no
    reactions:
      - key: "yes"
        label: "Let's go!"
      - key: "no"
        label: Not this time

  - key: gift_reveal
    name: Gift reveal
    email_subject: "{sender} has a gift for you 🎁"
    fields:
      message:
        max: 400
        required: true
      # Hidden under the scratch-off stamp until they scratch it.
      gift:
        max: 120
        required: true
      # Shown on the stamp before scratching, e.g. "Something you've wanted for months".
      hint:
        max: 80
        required: false
      note:
        max: 200
        required: false
    themes: [cream, kraft, rose]
    reply: reaction
    reactions:
      - key: love_it
        label: I love it!
      - key: thank_you
        label: Thank you!
      - key: cant_wait
        label: Can't wait!
      - key: you_shouldnt
        label: You shouldn't have!
